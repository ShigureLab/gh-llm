[project]
name = "gh-llm"
version = "0.1.16"
description = "🤖 CLI tooling for LLM-first GitHub reading and review workflows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []
authors = [{ name = "Nyakku Shigure", email = "sigure.qaq@gmail.com" }]
keywords = ["github", "cli", "llm", "code-review", "pull-requests", "issues"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/ShigureLab/gh-llm"
Documentation = "https://github.com/ShigureLab/gh-llm"
Repository = "https://github.com/ShigureLab/gh-llm"
Issues = "https://github.com/ShigureLab/gh-llm/issues"

[project.scripts]
gh-llm = "gh_llm.__main__:main"

[dependency-groups]
dev = ["ty>=0.0.69", "ruff>=0.16.2", "pytest>=9.1.1", "pytest-rerunfailures>=16.4"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
  # Pyflakes
  "F",
  # Pycodestyle
  "E",
  "W",
  # Isort
  "I",
  # Comprehensions
  "C4",
  # Debugger
  "T100",
  # Pyupgrade
  "UP",
  # Flake8-pyi
  "PYI",
  # Bugbear
  "B",
  # Pylint
  "PLE",
  # Flake8-simplify
  "SIM101",
  # Flake8-use-pathlib
  "PTH",
  # Pygrep-hooks
  "PGH004",
  # Flake8-type-checking
  "TC",
  # Flake8-raise
  "RSE",
  # Refurb
  "FURB",
  # Yesqa
  "RUF100",
]
ignore = [
  "E501", # line too long, duplicate with ruff fmt
]

[tool.ruff.lint.isort]
known-first-party = ["gh_llm"]
combine-as-imports = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
