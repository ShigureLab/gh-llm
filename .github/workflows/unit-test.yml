name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.15', '3.15t']
        architecture: ['x64']
    name: unittest - Python ${{ matrix.python-version }} on ${{ matrix.architecture }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          allow-prereleases: true

      - name: Install just
        uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          just ci-install

      - name: Verify test runtime
        run: |
          uv run python - <<'PY'
          import os
          import sys
          import sysconfig

          import gh_llm.cli
          import pytest

          requested = os.environ['UV_PYTHON']
          free_threaded = requested.endswith('t')
          print(sys.version)
          print(f'GIL enabled: {sys._is_gil_enabled()}')
          assert sys.version_info[:2] == tuple(map(int, requested.rstrip('t').split('.')))
          assert bool(sysconfig.get_config_var('Py_GIL_DISABLED')) == free_threaded
          assert sys._is_gil_enabled() == (not free_threaded)
          PY

      - name: unit test
        run: |
          just ci-test

      - name: e2e extension entrypoint
        env:
          UV_CACHE_DIR: /tmp/uv-cache
          UV_TOOL_DIR: /tmp/uv-tools
        run: |
          ./gh-llm --help
